<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Petshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="bg-personalizado-negro text-white">
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-personalizado-gris sidebar vh-100 p-3 fixed-top border-end border-personalizado-gris">

                <div class="mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-activity text-personalizado-morado fs-3"></i>
                    <h3 class="fw-bold text-personalizado-morado mb-0">
                        PetPulse
                    </h3>
                </div>
                <span
                    class="badge bg-dark text-personalizado-morado border border-personalizado-morado w-100 py-2 mb-3">
                    <i class="bi bi-bag-heart me-1"></i>
                    PetShop
                </span>
                <hr>

                <ul class="nav flex-column gap-2">

                    <li class="nav-item">
                        <a class="nav-link text-secondary link-hover" href="home.html">
                            <i class="bi bi-house"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-secondary link-hover" href="mascotas.html">
                            <i class="bi bi-heart-pulse"></i>
                            Mascotas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-secondary link-hover" href="triaje.html">
                            <i class="bi bi-clipboard2-pulse"></i>
                            Triaje
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-secondary link-hover" href="citas.html">
                            <i class="bi bi-calendar-event"></i>
                            Citas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active bg-personalizado-morado rounded text-white" href="#">
                            <i class="bi bi-bag"></i>
                            PetShop
                        </a>
                    </li>

                </ul>

                <div class="mt-auto pt-3">
                    <hr class="text-secondary">

                    <a href="carrito.html" class="btn btn-success w-100 mb-2">

                        <i class="bi bi-cart-fill"></i>

                        Ver Carrito

                        <span class="badge bg-dark" id="cantidadCarrito">0</span>

                    </a>

                    <a href="index.html" class="btn btn-outline-danger w-100">
                        <i class="bi bi-box-arrow-left"></i>
                        Cerrar sesión

                    </a>

                </div>


            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4" style="margin-left:16.666667%!important;">
                <h2 class="fw-bold mb-4">

                    <i class="bi bi-bag-heart-fill text-personalizado-morado"></i>

                    PetShop

                </h2>
                <div class="row mb-4">

                    <div class="col-md-6">

                        <input type="text" id="buscar" class="form-control input-personalizado-oscuro"
                            placeholder="Buscar producto...">

                    </div>

                    <div class="col-md-4">

                        <select id="categoria" class="form-select input-personalizado-oscuro">

                            <option value="Todos">Todas las categorías</option>

                            <option value="Alimento">Alimentos</option>

                            <option value="Accesorio">Accesorios</option>

                            <option value="Medicamento">Medicamentos</option>

                            <option value="Juguete">Juguetes</option>

                        </select>

                    </div>

                </div>
                <div class="row g-4" id="listaProductos">

                </div>

            </main>
        </div>
    </div>
    <script src="js/petshop.js"></script>

</body>

</html>
