<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Registro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-personalizado-negro text-white">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">

        <div class="bg-personalizado-gris rounded-4 shadow-lg p-4 w-100 border-personalizado-gris" style="max-width: 550px;">
            
            <div class="mb-4 text-center">
                <h2 class="fw-bold text-personalizado-morado">Crea tu Cuenta</h2>
                <p class="text-secondary">Únete a PetPulse para cuidar de tu mascota</p>
            </div>

  
            <div id="alertContainer"></div>

            <form id="registroForm">
                <div class="mb-3">
                    <label for="nombreCompleto" class="form-label fw-semibold text-light">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" class="form-control input-personalizado-oscuro" placeholder="Ej: Juan Pérez">
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label fw-semibold text-light">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control input-personalizado-oscuro" placeholder="ejemplo@correo.com">
                </div>
                <div class="mb-3">
                    <label for="nuevoUsuario" class="form-label fw-semibold text-light">Nombre de Usuario</label>
                    <input type="text" id="nuevoUsuario" class="form-control input-personalizado-oscuro" placeholder="Ej: juan123">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold text-light">Contraseña</label>
                        <input type="password" id="password" class="form-control input-personalizado-oscuro" placeholder="••••••••">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold text-light">Confirmar</label>
                        <input type="password" id="confirmPassword" class="form-control input-personalizado-oscuro" placeholder="••••••••">
                    </div>
                </div>
                
                <div class="mb-3 text-center">
                    <a href="index.html" class="text-decoration-none small text-secondary link-hover">¿Ya tienes cuenta? Inicia Sesión</a>
                </div>
                
                <button type="submit" class="btn btn-personalizado-morado w-100 py-2 fw-bold shadow">Registrarse</button>
            </form>

        </div>
    </div>

    <script src="js/registro.js"></script>
    <script src="js/permisos.js"></script>
</body>
</html>
