<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-personalizado-negro text-white">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row bg-personalizado-gris rounded-4 shadow-lg p-4 w-100 border border-secondary" style="max-width: 900px;">
            
            <div class="col-md-6 p-4">
                <div class="mb-4 text-center text-md-start">
                    <h2 class="fw-bold text-personalizado-morado">PetPulse</h2>
                    <p class="text-secondary">Inicia sesión para gestionar la clínica y petshop</p>
                </div>

                <div id="alertContainer"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="usuario" class="form-label fw-semibold text-light">Correo Electrónico / Usuario</label>
                        <input type="text" id="usuario" class="form-control input-personalizado-oscuro" placeholder="Ej: admin@petpulse.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-light">Contraseña</label>
                        <input type="password" id="password" class="form-control input-personalizado-oscuro" placeholder="••••••••" required>
                    </div>
                    <div class="mb-3 d-flex justify-content-between">
                        <a href="registro.html" class="text-decoration-none small text-secondary link-hover">¿No tienes cuenta? Regístrate</a>
                        <a href="recuperar.html" class="text-decoration-none small text-personalizado-morado link-hover">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-personalizado-morado w-100 py-2 fw-bold shadow d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>
            </div>

            <div class="col-md-6 bg-black rounded-4 d-none d-md-flex flex-column justify-content-center align-items-center text-white p-4 text-center border border-personalizado-morado">
                <i class="bi bi-shield-plus text-personalizado-morado display-4 mb-3"></i>
                <h3 class="fw-bold mb-3 text-personalizado-morado">Gestión Veterinaria & Triaje</h3>
                <p class="px-3 small text-secondary">
                    Sistema avanzado para la automatización de expedientes clínicos, control de citas y semáforo inteligente de urgencias médicas para mascotas.
                </p>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
