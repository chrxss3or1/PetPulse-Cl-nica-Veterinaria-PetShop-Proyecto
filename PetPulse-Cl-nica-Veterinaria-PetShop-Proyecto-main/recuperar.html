<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/button-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-personalizado-negro text-white d-flex align-items-center justify-content-center vh-100">

    <div class="card bg-personalizado-gris text-white p-4 rounded-4 shadow border border-personalizado-gris" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-patch-question text-personalizado-morado display-4"></i>
            <h2 class="fw-bold mt-2">¿Olvidó su contraseña?</h2>
            <p class="text-secondary small">Ingrese su correo registrado para enviarle las credenciales de soporte de la veterinaria.</p>
        </div>

        <form id="recuperarForm">
            <div class="mb-3">
                <label for="recuperarCorreo" class="form-label fw-semibold">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="recuperarCorreo" class="form-control input-personalizado-oscuro" placeholder="ejemplo@correo.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-personalizado-morado w-100 fw-bold py-2 shadow mb-3">
                Enviar Enlace de Soporte
            </button>
            
            <div class="text-center">
                <a href="index.html" class="text-personalizado-morado small text-decoration-none fw-semibold">
                    <i class="bi bi-arrow-left"></i> Volver al Login
                </a>
            </div>
        </form>
    </div>

    <script src="js/recuperar.js"></script>
</body>
</html>
