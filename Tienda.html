<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse - Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-personalizado-negro text-white">

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block bg-personalizado-gris sidebar vh-100 p-3 fixed-top border-end border-personalizado-gris">
                <div class="mb-4 text-center text-md-start d-flex align-items-center gap-2">
                    <i class="bi bi-activity text-personalizado-morado fs-4"></i>
                    <h3 class="fw-bold text-personalizado-morado mb-0">PetPulse</h3>
                </div>
                <span class="badge bg-dark text-personalizado-morado border border-personalizado-morado w-100 py-2 mb-3">
                    <i class="bi bi-shield-check me-1"></i> Panel General
                </span>
                <hr class="text-secondary">
                <ul class="nav flex-column gap-2">
                    <li class="nav-item">
            <a class="nav-link active rounded text-white bg-personalizado-morado p-2 d-flex align-items-center gap-2" href="home.html">
                <i class="bi bi-house-door"></i>
                Inicio
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 text-light d-flex align-items-center gap-2" href="mascotas.html">
                <i class="bi bi-heart-pulse text-personalizado-morado"></i>
                Mis Mascotas
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 d-flex align-items-center gap-2" href="triaje.html">
                <i class="bi bi-clipboard2-pulse"></i>
                Triaje de Síntomas
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 d-flex align-items-center gap-2" href="citas.html">
                <i class="bi bi-calendar-event"></i>
                Reservar Cita
            </a>
        </li>

          <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 d-flex align-items-center gap-2"
             href="Tienda.html">
             <i class="bi bi-bag-dash"></i>
             PetShop / Tienda
           </a>
       </li>

        <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 d-flex align-items-center gap-2" href="veterinario.html">
                <i class="bi bi-clipboard2-heart"></i>
                Veterinario
            </a>
        </li>


        <li class="nav-item">
            <a class="nav-link rounded text-secondary link-hover p-2 d-flex align-items-center gap-2" href="admin.html">
                <i class="bi bi-speedometer2"></i>
                Administración
            </a>
        </li>
                </ul>
                <div class="position-absolute bottom-0 start-0 w-100 p-3">
                    <hr class="text-secondary">
                    <a href="index.html" class="btn btn-outline-danger w-100 fw-bold d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
                    </a>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4" style="margin-left: 16.666667% !important;">
                
                <div class="d-flex justify-content-between flex-wrap align-items-center pt-3 pb-2 mb-4 border-bottom border-personalizado-gris">
                    <h1 class="h2 fw-bold">Pet<span class="text-personalizado-morado">Shop</span></h1>
                    <button class="btn btn-personalizado-morado fw-bold d-flex align-items-center gap-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
                        <i class="bi bi-cart3"></i> Carrito <span class="badge bg-dark border border-light" id="badgeCarrito">0</span>
                    </button>
                </div>

                <div class="mb-4 d-flex gap-2 flex-wrap">
                    <button class="btn btn-sm btn-outline-light filtro-btn active" data-cat="todos">Todos</button>
                    <button class="btn btn-sm btn-outline-light filtro-btn" data-cat="Alimento">Alimentos</button>
                    <button class="btn btn-sm btn-outline-light filtro-btn" data-cat="Accesorio">Accesorios</button>
                    <button class="btn btn-sm btn-outline-light filtro-btn" data-cat="Medicamento">Medicamentos</button>
                </div>

                <div class="row g-4 mb-5" id="contenedorProductos">
                </div>

            </main>

        </div>
    </div>

    <div class="offcanvas offcanvas-end bg-personalizado-gris text-white border-start border-personalizado-morado" tabindex="-1" id="carritoOffcanvas">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="fw-bold text-personalizado-morado"><i class="bi bi-cart3 me-2"></i>Carrito de Compras</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="listaCarrito" class="flex-grow-1"></div>

            <div class="border-top border-secondary pt-3 mt-3">
                <div class="d-flex justify-content-between small text-secondary">
                    <span>Subtotal</span>
                    <span id="carritoSubtotal">₡0</span>
                </div>
                <div class="d-flex justify-content-between small text-secondary mb-2">
                    <span>IVA (13%)</span>
                    <span id="carritoImpuesto">₡0</span>
                </div>
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                    <span>Total</span>
                    <span class="text-personalizado-morado" id="carritoTotal">₡0</span>
                </div>
                <button class="btn btn-personalizado-morado w-100 fw-bold" id="btnProcesarPedido">Procesar Pedido</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Tienda.js"></script>
</body>
</html>
